<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Onboarding - Fiscal Orchestration Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; min-height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 40px 30px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
        .brand-section { text-align: center; margin-bottom: 32px; }
        .brand-logo { font-size: 2.5rem; margin-bottom: 8px; display: inline-block; }
        .brand-title { color: var(--primary); font-size: 1.5rem; font-weight: 700; margin: 0; }
        .brand-subtitle { color: #64748b; font-size: 0.875rem; margin: 6px 0 0 0; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.875rem; color: #64748b; }
        .auth-link { color: var(--accent); text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-section">
                <span class="brand-logo">⚖️</span>
                <h2 class="brand-title">Employee Registration</h2>
                <p class="brand-subtitle">Create institutional credentials to access records</p>
            </div>

            {% if error %}
                <div class="alert-banner">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label class="form-label">Employee ID Number</label>
                    <input type="text" name="employee_id" class="form-input" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label">Secure Access Password</label>
                    <input type="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">Register New Account</button>
            </form>
            <p class="auth-footer">Already registered? <a href="/login" class="auth-link">Sign In</a></p>
        </div>
    </div>
</body>
</html>
