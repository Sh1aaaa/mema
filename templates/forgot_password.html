<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Fiscal Orchestration Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; min-height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 40px 30px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
        .brand-section { text-align: center; margin-bottom: 32px; }
        .brand-logo { font-size: 2.5rem; margin-bottom: 8px; display: inline-block; }
        .brand-title { color: var(--primary); font-size: 1.5rem; font-weight: 700; margin: 0; }
        .brand-subtitle { color: #64748b; font-size: 0.875rem; margin: 6px 0 0 0; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.875rem; color: #64748b; }
        .auth-link { color: var(--accent); text-decoration: none; font-weight: 500; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Exact Brand Header Layout from Login Portal -->
            <div class="brand-section">
                <span class="brand-logo">⚖️</span>
                <h2 class="brand-title">Fiscal Gate Portal</h2>
                <p class="brand-subtitle">Authorized Identity & Account Recovery Access</p>
            </div>

            {% if error %}
                <div class="alert-banner" style="margin-bottom: 16px;">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Institutional User ID</label>
                    <input type="text" name="employee_id" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">Update Password</button>
            </form>
            
            <!-- Standardized Footer Link Element -->
            <p class="auth-footer">Remembered your access key? <a href="/login" class="auth-link">Back to Login</a></p>
        </div>
    </div>
</body>
</html>
